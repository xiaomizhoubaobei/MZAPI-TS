# 此工作流会对长时间没有活动的issues和PRs发出警告，并在一定时间后关闭它们。
#
# 你可以通过修改此文件来调整行为。
# 更多信息，请参阅：
# https://github.com/actions/stale
name: 标记不活跃的issues和pull requests

on:
 schedule:
  - cron: '37 21 * * *'

permissions:
 contents: read

jobs:
 stale:
  runs-on: ubuntu-latest
  permissions:
   issues: write
   pull-requests: write

  steps:
   - name: Harden the runner (Audit all outbound calls)
     uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
     with:
      egress-policy: audit

   - name: Audit - Workflow started
     run: |
       echo "Stale issues/PRs workflow started" >> audit.log
       echo "Scheduled run at: $(date -u)" >> audit.log
       echo "Cron schedule: 37 21 * * *" >> audit.log

   - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
     with:
      repo-token: ${{ secrets.GITHUB_TOKEN }}
      stale-issue-message: '此Issue已长时间没有活动'
      stale-pr-message: '此Pull Request已长时间没有活动'
      stale-issue-label: '无issue活动'
      stale-pr-label: '无pr活动'
   - name: Audit - Stale action completed
     run: |
       echo "Stale action completed" >> audit.log
       echo "Timestamp: $(date -u)" >> audit.log

   - name: Upload audit log
     uses: actions/upload-artifact@v7
     with:
       name: stale-audit-log
       path: audit.log
       retention-days: 30
